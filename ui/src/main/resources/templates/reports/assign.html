<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (title=#{html.page.report.assign.title})}"></head>
<body class="layout-fixed">
<div class="wrapper">
	<header th:replace="~{fragments/navbar :: navbar-header(subpage = 'reports')}"></header>
	<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'report', subpage = 'reports')}"></aside>

	<section>
		<div class="content-wrapper">
			<h3>
				<span th:text="#{html.page.report.assign.title}"></span>
			</h3>
			<div class="panel panel-default">
				<div class="panel-heading">
				</div>
				<div class="panel-body">
					<div class="table-responsive">
						<table id="listTable" class="table table-striped table-hover">
							<thead>
							<tr>
								<th class="col-md-1"></th>
								<th class="col-md-3" th:text="#{html.entity.user.name}"></th>
								<th class="col-md-1" th:text="#{html.entity.user.userId}"></th>
								<th class="col-md-7" th:text="#{html.entity.user.positions}"></th>
							</tr>
							</thead>

							<tbody>

							</tbody>

							<tfoot>
							<tr >
								<th>&nbsp;</th>
								<th class="input-filter"></th>
								<th class="input-filter"></th>
								<th class="input-filter"></th>
							</tr>
							</tfoot>
						</table>
					</div>
				</div>
			</div>
		</div>
	</section>
</div>

<link rel="stylesheet" th:href="@{/css/reports/assign.css}" />

<nav th:replace="~{fragments/footer :: footer}"></nav>

<script type="application/json" id="report-assign-config" th:inline="javascript">
	{
		"searchTxt": [[#{html.datatables.search}]],
		"dropdownTxt": [[#{html.datatables.dropdown}]],
		"infoDefaultTxt": [[#{html.datatables.info.default}]],
		"infoEmptyTxt": [[#{html.datatables.info.empty}]],
		"infoLoadingTxt": [[#{html.datatables.info.loading}]],
		"infoFilteredTxt": [[#{html.datatables.info.filtered}]],
		"fieldUpdatedMsg": [[#{html.page.report.assign.successMsg}]],
		"fieldNotUpdatedMsg": [[#{html.page.report.assign.failMsg}]],
		"backendUrl": [[@{/rest/report/assign}]],
		"templateId": [[${templateId}]]
	}
</script>
<script th:src="@{/js/reports/assign.js}"></script>
</body>
</html>
