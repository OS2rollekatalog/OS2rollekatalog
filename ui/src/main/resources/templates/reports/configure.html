<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (title=#{html.page.report.full.title})}"></head>
<body class="layout-fixed">
<div class="wrapper">
	<header th:replace="~{fragments/navbar :: navbar-header(subpage = 'reports')}"></header>
	<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'report.full', subpage = 'reports')}"></aside>

	<section>
		<div class="content-wrapper">
			<h3>
				<span th:text="#{html.page.report.title}"></span>
			</h3>

			<div class="panel panel-default">
				<div class="panel-heading"></div>
				<div class="panel-body">
					<form id="reportForm" class="form-horizontal" th:object="${reportForm}">

						<div class="form-group">
							<h4 class="col-sm-12" th:text="#{html.page.report.date}"></h4>
						</div>

						<div class="form-group">
							<input id="realDateField" th:field="*{date}" type="hidden">
							<div style="overflow:hidden;" class="col-sm-offset-3 col-sm-9">
								<div class="col-md-6">
									<div id="datePicker"></div>
								</div>
							</div>
						</div>

						<hr/>

						<div id="filterOptions">
							<div th:replace="~{reports/fragments/filterOptionsFragment :: filterOptions(allItSystems = ${allItSystems}, allManagers = ${allManagers})}"></div>
						</div>

						<hr/>

						<div class="form-group">
							<h4 class="col-sm-12" th:text="#{html.page.report.column.text}"></h4>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowUsers" th:field="*{showUsers}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.user}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="UserColumnCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowUsers" th:attr="checked=${reportForm.showUsers}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowOUs" th:field="*{showOUs}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.ou}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="OUColumnCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowOUs" th:attr="checked=${reportForm.showOUs}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowUserRoles" th:field="*{showUserRoles}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.userrole}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="UserRolesColumnCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowUserRoles" th:attr="checked=${reportForm.showUserRoles}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowNegativeRoles" th:field="*{showNegativeRoles}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.negativeroles}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="NegativeColumnCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowNegativeRoles" th:attr="checked=${reportForm.showNegativeRoles}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowKLE" th:field="*{showKLE}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.kle}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="KLEColumnCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowKLE" th:attr="checked=${reportForm.showKLE}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowItSystems" th:field="*{showItSystems}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.itsystem}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="ItSystemDataColumnCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowItSystems" th:attr="checked=${reportForm.showItSystems}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowInactiveUsers" th:field="*{showInactiveUsers}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.show.inactive}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="ShowInactiveUsersCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowInactiveUsers" th:attr="checked=${reportForm.showInactiveUsers}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 20px">
							<input class="column-choice" id="realShowSystemRoles" th:field="*{showSystemRoles}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.show.systemroles}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="ShowSystemRolesCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowSystemRoles" th:attr="checked=${reportForm.showSystemRoles}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<div class="form-group" style="margin-bottom: 40px">
							<input class="column-choice" id="realShowOrgUnitAllocations" th:field="*{showOrgUnitAllocations}" type="hidden">
							<label class="col-sm-3 control-label" th:text="#{html.page.report.column.show.orgUnitAllocations}"></label>
							<div class="col-sm-9">
								<div class="checkbox c-checkbox">
									<label>
										<input id="ShowOrgUnitAllocationsCheckbox" type="checkbox" class="js-column-choice" data-column-name="ShowOrgUnitAllocations" th:attr="checked=${reportForm.showOrgUnitAllocations}"/>
										<span class="fa fa-check"></span>
									</label>
								</div>
							</div>
						</div>

						<hr/>

						<div class="form-group">
							<div class="col-sm-offset-1 col-sm-10">
								<input class="btn btn-lg btn-primary" type="submit" th:value="#{html.page.report.generate}" style="width: 250px;" /> &nbsp;&nbsp;
								<input class="btn btn-lg btn-warning js-open-save-template-modal" th:value="#{html.page.report.save.template}" style="width: 250px;" />
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</section>
</div>

<div class="modal fade" id="saveTemplateModal" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content">
			<div class="modal-header">
				<h4 th:text="#{html.page.report.modal.title}"></h4>
			</div>

			<div class="modal-body" style="min-height:70px;">
				<label class="col-sm-2 control-label" th:text="#{html.page.report.modal.name}"></label>
				<div class="col-sm-10">
					<input id="templateName" class="form-control"/>
				</div>
			</div>

			<div class="modal-footer">
				<button type="button" class="btn btn-primary js-save-template" th:text="#{html.control.button.save}"></button>
				<button type="button" class="btn btn-danger js-close-save-template" th:text="#{html.control.button.cancel}"></button>
			</div>
		</div>
	</div>
</div>

<div class="modal-spinner">
	<i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i>
	<span class="sr-only">Henter rapport...</span>
</div>

<link rel="stylesheet" th:href="@{/css/reports/configure.css}" />

<nav th:replace="~{fragments/footer :: footer}"></nav>

<script type="application/json" id="report-full-config" th:inline="javascript">
	{
		"url": [[@{/ui/report}]],
		"restUrl": [[@{/rest/report}]],
		"restUrlOus": [[@{/rest/ous}]],
		"fieldUpdatedMsg": [[#{html.page.report.modal.successMsg}]],
		"fieldNotUpdatedMsg": [[#{html.page.report.modal.failMsg}]],
		"manager": [[${reportForm.managerFilter}]],
		"itsystemFilter": [[${reportForm.itsystemFilter}]],
		"unitFilter": [[${reportForm.unitFilter}]],
		"templateId": [[${templateId}]],
		"allItSystems": [[${allItSystems}]],
		"allOrgUnits": [[${allOrgUnits}]]
	}
</script>
<script th:src="@{/js/reports/configure.js}"></script>
</body>
</html>
