<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header (title=#{html.page.itsystem.edit.title})}"></head>
<body th:with="permission=${T(dk.digitalidentity.rc.security.permission.Permission)},
				section=${T(dk.digitalidentity.rc.security.permission.Section)}">

<div class="wrapper">
    <header th:replace="~{fragments/navbar :: navbar-header(subpage = 'roles')}"></header>
    <aside th:replace="~{fragments/navbar :: navbar-aside (page = 'itsystem.list', subpage = 'roles')}"></aside>

    <section>
        <div class="content-wrapper">
            <h3>
                <a th:href="@{/ui/itsystem/list}" class="btn btn-default">
                    <span><i class="fa fa-arrow-left"></i></span>
                </a>
                <span th:text="#{html.page.itsystem.edit.title}"></span>
            </h3>

            <div class="panel panel-default">
                <div class="panel-heading"></div>
                <div class="panel-body">

                    <form id="role-form" class="form-horizontal" th:object="${itsystem}">
                        <input th:field="*{id}" type="hidden"/>

                        <fieldset>
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.name}"></label>
                                <div class="col-sm-8">
                                    <input th:field="*{name}"
                                           th:readonly="${#strings.toString(itsystem.systemType)} == 'KOMBIT'"
                                           class="form-control"/>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${#lists.contains({'AD'}, #strings.toString(itsystem.systemType))}">
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.domain}"></label>
                                <div class="col-sm-8">
                                    <input th:field="*{domain.name}" readonly="readonly" class="form-control"/>
                                </div>
                            </div>
                        </fieldset>

							<fieldset>
								<div class="form-group">
									<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.itsystem.email}"></label>
									<div class="col-sm-8 col-xs-11">
										<input th:field="*{email}" class="form-control" />
										<em class="icon-question" data-toggle="popover" data-trigger="click" data-placement="top" data-container="body" style="position: absolute; top: 10px; right: -20px;" th:attr="data-content=#{html.entity.itsystem.email.help}"></em>
										<span id="emailValidationFail" class="text-danger" style="display:none" th:text="#{html.errors.itsystem.email.notemail}"></span>
									</div>
								</div>
							</fieldset>

							<fieldset>
								<div class="form-group">
									<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.itsystem.advisEmail}"></label>
									<div class="col-sm-8 col-xs-11">
										<input th:field="*{advisEmail}" class="form-control" />
										<em class="icon-question" data-toggle="popover" data-trigger="click" data-placement="top" data-container="body" style="position: absolute; top: 10px; right: -20px;" th:attr="data-content=#{html.entity.itsystem.advisEmail.help}"></em>
										<span id="advisEmailValidationFail" class="text-danger" style="display:none" th:text="#{html.errors.itsystem.email.notemail}"></span>
									</div>
								</div>
							</fieldset>

							<fieldset th:if="${#strings.toString(itsystem.systemType)} == 'MANUAL'">
								<div class="form-group">
									<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.itsystem.manualEffectuationEnabled}"></label>
									<div class="col-sm-1 col-xs-1">
										<div class="checkbox c-checkbox" style="display:inline-block;">
											<label>
												<input id="manualEffectuationEnabled-checkbox" type="checkbox"
													   th:attr="checked=${itsystem.manualEffectuationEnabled}"/>
												<span class="fa fa-check"></span>
											</label>
										</div>
										<em class="icon-question" data-toggle="popover" data-trigger="click" data-placement="top" data-container="body" style="margin-left: 5px;" th:attr="data-content=#{html.entity.itsystem.manualEffectuationEnabled.help}"></em>
									</div>
								</div>
							</fieldset>

							<fieldset id="manualWelcomeEmailFieldset" th:if="${#strings.toString(itsystem.systemType)} == 'MANUAL'" th:style="${itsystem.manualEffectuationEnabled} ? '' : 'display:none;'">
								<div class="form-group">
									<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.itsystem.manualWelcomeEmail}"></label>
									<div class="col-sm-8 col-xs-11">
										<a role="button" id="manualWelcomeEmailToggle" data-toggle="collapse" href="#manualWelcomeEmailCollapse"
										   aria-expanded="false" aria-controls="manualWelcomeEmailCollapse">
											<em id="manualWelcomeEmailCaret" class="fa fa-caret-right"></em>&nbsp;
											<span th:text="#{html.entity.itsystem.manualWelcomeEmail.edit}"></span>
										</a>
									</div>
								</div>

								<div id="manualWelcomeEmailCollapse" class="collapse">
									<div class="form-group" style="margin-top: 20px;">
										<div class="col-sm-offset-2 col-sm-8">
											<ul class="nav nav-tabs" role="tablist">
												<li role="presentation" class="active">
													<a href="#manualEffectuationEmailTab-ASSIGN" aria-controls="manualEffectuationEmailTab-ASSIGN" role="tab" data-toggle="tab" class="manualEffectuationEmailTab-link" data-operation="ASSIGN" th:text="#{html.entity.itsystem.manualWelcomeEmail.operation.tildel}"></a>
												</li>
												<li role="presentation">
													<a href="#manualEffectuationEmailTab-REMOVE" aria-controls="manualEffectuationEmailTab-REMOVE" role="tab" data-toggle="tab" class="manualEffectuationEmailTab-link" data-operation="REMOVE" th:text="#{html.entity.itsystem.manualWelcomeEmail.operation.fjern}"></a>
												</li>
											</ul>
										</div>
									</div>

									<div class="form-group" style="margin-top: 20px;">
										<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.itsystem.manualWelcomeEmail.enabled}"></label>
										<div class="col-sm-1 col-xs-1">
											<div class="checkbox c-checkbox" style="display:inline-block;">
												<label>
													<input id="manualWelcomeEmailTemplateEnabled-checkbox" type="checkbox"/>
													<span class="fa fa-check"></span>
												</label>
											</div>
											<em class="icon-question" data-toggle="popover" data-trigger="click" data-placement="top" data-container="body" style="margin-left: 5px;" th:attr="data-content=#{html.entity.itsystem.manualWelcomeEmail.enabled.help}"></em>
										</div>
									</div>

									<div class="form-group" style="margin-top: 20px;">
										<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.email_template.name}"></label>
										<div class="col-sm-8 col-xs-11">
											<input id="manualWelcomeEmailTemplateTitle" class="form-control"/>
										</div>
									</div>

									<div class="form-group" style="margin-top: 20px;">
										<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.email_template.message}"></label>
										<div class="col-sm-8 col-xs-11">
											<textarea id="manualWelcomeEmailTemplateMessage" rows="10" class="mb-0 preformat" style="width:100%;"></textarea>
										</div>
									</div>

									<div class="form-group" style="margin-top: 20px;">
										<label class="col-sm-2 col-xs-12 control-label" th:text="#{html.entity.email_template.notes}"></label>
										<div class="col-sm-8 col-xs-11">
											<textarea id="manualWelcomeEmailTemplateNotes" rows="3" class="mb-0 form-control" style="width:100%;"></textarea>
										</div>
									</div>

									<div class="form-group" style="margin-top: 20px;">
										<div class="col-sm-offset-2 col-sm-10">
											<button type="button" style="margin-right: 5px;" class="btn btn-primary" id="manualWelcomeEmailTemplateSave" th:text="#{html.control.button.save}"></button>
											<button type="button" style="margin-right: 5px;" class="btn btn-warning" id="manualWelcomeEmailTemplateTest" th:text="#{html.page.email_template.test}"></button>
										</div>
									</div>

									<div class="form-group" style="margin-top: 20px;">
										<div class="col-sm-offset-2 col-sm-8">
											<h4 th:text="#{html.entity.email_template.placeholders}"></h4>
											<p th:text="#{html.entity.email_template.placeholders.intro}"></p>
											<table class="table">
												<thead>
												<tr>
													<th th:text="#{html.entity.email_template.placeholders.placeholder}" style="width: 250px;"/>
													<th th:text="#{html.entity.email_template.placeholders.description}"/>
												</tr>
												</thead>
												<tbody>
												<tr th:each="placeholder : ${T(dk.digitalidentity.rc.service.ManualWelcomeEmailTemplateService).PLACEHOLDERS}">
													<td th:text="${placeholder.placeholder}"/>
													<td class="preformat" th:text="#{${placeholder.description}}"/>
												</tr>
												</tbody>
											</table>
										</div>
									</div>
								</div>
							</fieldset>

                        <fieldset>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.entity.itsystem.identifier}"></label>
                                <div class="col-sm-8">
                                    <input th:field="*{identifier}" readonly="readonly" class="form-control"/>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.type}"></label>
                                <div class="col-sm-8">
                                    <input th:value="#{__*{systemType.message}__}" readonly="readonly"
                                           class="form-control"/>
                                </div>
                            </div>
                        </fieldset>

							<fieldset th:if="${@roleCatalogueConfiguration.getIntegrations().getKitos().isEnabled()}">
								<input id="selectedKitosITSystemId" th:value="${kitosITSystemId}" hidden>
								<div class="form-group">
									<label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.kitosITSystem}"></label>
									<div class="col-sm-8">
										<select style="width: 100%;" class="form-control m-b" id="kitosItSystemSelector">
											<option></option>
											<option th:each="option : ${select2KitosITSystems}" th:value="${option.id}" th:text="${option.text}" th:selected="${option.id} == ${kitosITSystemId}"></option>
										</select>
									</div>
								</div>
							</fieldset>

                        <fieldset>
                            <div class="form-group">
									<label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.notificationEmail}"></label>
                                <div class="col-sm-8">
                                    <input th:field="*{notificationEmail}" class="form-control"/>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="form-group">
									<label class="col-sm-2 control-label">
										<span th:text="#{html.entity.itsystem.attestationResponsible}"></span>
										<em th:if="${kitosITSystemId != null && #lists.isEmpty(attestationResponsibleSelections)}" class="fa fa-warning text-warning" th:title="#{html.entity.itsystem.attestationResponsible.kitosError}"></em>
									</label>
									<div class="col-sm-8">
										<select id="attestationResponsibleSelect" class="form-control" multiple="multiple"
												th:disabled="${kitosITSystemId != null}" style="width:100%">
											<option th:each="sel : ${attestationResponsibleSelections}"
													th:value="${sel['id']}"
													th:text="${sel['text']}"
													selected="selected"></option>
										</select>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="form-group">
									<label class="col-sm-2 control-label">
										<span th:text="#{html.entity.itsystem.systemOwner}"></span>
										<em th:if="${kitosITSystemId != null && #lists.isEmpty(systemOwnerSelections)}" class="fa fa-warning text-warning" th:title="#{html.entity.itsystem.systemOwner.kitosError}"></em>
									</label>
									<div class="col-sm-8">
										<select id="systemOwnerSelect" class="form-control" multiple="multiple"
												th:disabled="${kitosITSystemId != null}" style="width:100%">
											<option th:each="sel : ${systemOwnerSelections}"
													th:value="${sel['id']}"
													th:text="${sel['text']}"
													selected="selected"></option>
										</select>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.notes}"></label>
                                <div class="col-sm-8">
                                    <textarea rows="5" th:field="*{notes}" class="form-control"></textarea>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${attestationEnabled}">
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.entity.itsystem.att_exempt}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="att-exempt-checkbox" type="checkbox" data-flag="hidden"
                                                   th:attr="checked=${itsystem.attestationExempt}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.hidden}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="hidden-checkbox" type="checkbox" data-flag="hidden"
                                                   th:attr="checked=${itsystem.hidden}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${#strings.toString(itsystem.systemType)} == 'AD'">
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.entity.itsystem.paused}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="paused-checkbox" type="checkbox" data-flag="paused"
                                                   th:attr="checked=${itsystem.paused}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset
                                th:if="${#strings.toString(itsystem.systemType)} == 'AD' or ${#strings.toString(itsystem.systemType)} == 'SAML' or ${#strings.toString(itsystem.systemType)} == 'MANUAL'">
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.entity.itsystem.canEditThroughApi}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="canEditThroughApi-checkbox" type="checkbox"
                                                   th:attr="checked=${itsystem.canEditThroughApi}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.entity.itsystem.access_blocked}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="accessBlocked-checkbox" type="checkbox" data-flag="hidden"
                                                   th:attr="checked=${itsystem.accessBlocked}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${@roleCatalogueConfiguration.apiControl.enabled}">
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.entity.itsystem.api_managed_role_assignments}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="apiManagedRoleAssignments-checkbox" type="checkbox"
                                                   data-flag="hidden"
                                                   th:attr="checked=${itsystem.apiManagedRoleAssignments}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${#strings.toString(itsystem.systemType)} == 'AD'">
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.entity.itsystem.readonly}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="readonly-checkbox" type="checkbox" data-flag="readonly"
                                                   th:attr="checked=${itsystem.readonly}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${#strings.toString(itsystem.systemType)} == 'AD'">
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.control.operations}"></label>
                                <div class="col-sm-8">
									<a id="addAdRoleBtn" class="btn btn-lg btn-primary js-open-ad-role-modal"
									   th:text="#{html.page.itsystem.action.new.systemrole.ad}"
									   th:disabled="${!@permissionCheck.isAllowed(section.IT_SYSTEM, permission.UPDATE)}"></a>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.page.itsystem.edit.modal.oufilter.label}"></label>
                                <div class="col-sm-1">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="ouFilterEnabled-checkbox" type="checkbox"
                                                   th:attr="checked=${itsystem.ouFilterEnabled}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset id="ouFilterButtonField" hidden>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"></label>
                                <div class="col-sm-8">
                                    <a id="ouFilterBtn" class="btn btn-lg btn-primary col-sm-2"
                                       th:text="#{html.page.itsystem.edit.modal.oufilter.title}"></a>
                                    <label th:if="${#lists.isEmpty(selectedOUs)}" class="col-sm-8"
                                           style="padding-top: 7px;"
                                           th:text="#{html.page.itsystem.edit.modal.oufilter.empty}"></label>
                                    <label th:if="${not #lists.isEmpty(selectedOUs)}" class="col-sm-8"
                                           style="padding-top: 7px;"
                                           th:text="#{html.page.itsystem.edit.modal.oufilter.not_empty(${#lists.size(selectedOUs)})}"></label>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${#strings.toString(itsystem.systemType)} == 'SAML'">
                            <div class="form-group">
                                <label class="col-sm-2 control-label"
                                       th:text="#{html.entity.itsystem.subscribedto}"></label>
                                <div class="col-sm-8">
                                    <div class="checkbox c-checkbox">
                                        <label>
                                            <input id="subscribedToCheckbox" style="padding-top:2px; padding-bottom:2px"
                                                   class="role-checkbox" type="checkbox"
                                                   th:attr="checked=${itsystem.subscribedTo != null}"/>
                                            <span class="fa fa-check"></span>
                                        </label>
                                    </div>

                                    <div class="col-sm-10">
                                        <select id="subscribedTo" style="float:right; width:95%"
                                                class="form-control m-b">
                                            <option id="defaultOption" th:selected="${itsystem.subscribedTo != null}"
                                                    th:text="#{html.select.default}"></option>
                                            <option th:each="masterSystem : ${itsystemMasterList}"
                                                    th:value="${masterSystem.masterId}"
                                                    th:text="${masterSystem.name}"
                                                    th:selected="${masterSystem.masterId == itsystem.subscribedTo}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </fieldset>

                        <!-- Request/Approve settings -->
                        <th:block th:if="${@settingsService.isRequestApproveEnabled()}">
                            <fieldset>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"
                                           th:text="#{html.entity.itsystem.requestersetting}"></label>
                                    <div class="col-sm-8">
										<select id="requesterSettingsSelect" class="form-control" multiple
												th:field="*{requesterPermission}">
											<option th:each="requesterOpt : ${T(dk.digitalidentity.rc.rolerequest.model.enums.RequestableBy).values()}"
													th:value="${requesterOpt}"
													th:text="#{__${requesterOpt.getMessage()}__}"
													th:selected="${requesterPermission != null and #lists.contains(requesterPermission, requesterOpt)}"></option>
										</select>
                                    </div>
                                </div>
                            </fieldset>

                            <fieldset>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"
                                           th:text="#{html.entity.itsystem.approversetting}"></label>
                                    <div class="col-sm-8">
										<select id="approverSettingsSelect" class="form-control" multiple
												th:field="*{approverPermission}">
											<option th:each="approverOpt : ${T(dk.digitalidentity.rc.rolerequest.model.enums.ApprovableBy).values()}"
													th:value="${approverOpt}"
													th:text="#{__${approverOpt.getMessage()}__}"
													th:selected="${approverPermission != null and #lists.contains(approverPermission, approverOpt)}"></option>
										</select>
                                    </div>
                                </div>
                            </fieldset>
                        </th:block>

                        <fieldset id="addRoleButtonField" th:if="${#strings.toString(itsystem.systemType)} == 'SAML'">
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.control.operations}"></label>
                                <div class="col-sm-8">
									<a id="newSamlRoleBtn" class="btn btn-lg btn-primary js-open-saml-role-modal"
									   th:text="#{html.page.itsystem.action.new.systemrole.saml}"></a>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset th:if="${#strings.toString(itsystem.systemType)} == 'MANUAL'">
                            <div class="form-group">
                                <label class="col-sm-2 control-label" th:text="#{html.control.operations}"></label>
                                <div class="col-sm-8">
									<a class="btn btn-lg btn-primary js-open-saml-role-modal"
									   th:text="#{html.page.itsystem.action.new.systemrole.manual}"></a>
                                </div>
                            </div>
                        </fieldset>
                    </form>

                    <!--  START AD PANEL -->
                    <form class="form-horizontal" th:if="${#strings.toString(itsystem.systemType)} == 'AD'">
                        <ul class="nav nav-tabs">
                            <li th:class="active">
                                <a data-toggle="tab" href="#systemRole_menu"
                                   th:text="#{html.page.itsystem.pane.label}"></a>
                            </li>
                            <li>
                                <a data-toggle="tab" href="#userRole_menu"
                                   th:text="#{html.page.itsystem.pane.userroles.label}"></a>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <div id="systemRole_menu" class="tab-pane fade in active">
                                <div style="margin-bottom:20px;">
                                    <div th:disabled="${!@permissionCheck.isAllowed(section.USER_ROLE, permission.CREATE)}" class="btn btn-lg btn-primary js-convert-system-roles" style="width:auto;">
                                       <span th:text="#{html.page.itsystem.pane.systemroles.convert}"></span>
                                    </div>
                                </div>

                                <div class="table-responsive">
                                    <table class="table table-striped listTable">
                                        <thead>
                                        <tr>

															th:value="${opt}"

												</select>
											</td>

																<a th:href="@{/ui/userroles/edit/{id}(id=${role.id})}"><em class="fa fa-pencil"></em></a>

                                                </td>
                                            </th:block>
                                            <th:block th:if="${role.delegatedFromCvr != null}">
                                                <td class="col-md-1">&nbsp;</td>
                                            </th:block>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
