<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (title=#{html.page.rolegroup.view.title})}"></head>
<body class="layout-fixed">
	<div class="wrapper">
		<header th:replace="~{fragments/navbar :: navbar-header(subpage = 'roles')}"></header>
		<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'rolegroups.new', subpage = 'roles')}"></aside>

		<section th:with="permission=${T(dk.digitalidentity.rc.security.permission.Permission)},
section=${T(dk.digitalidentity.rc.security.permission.Section)}">
			<div class="content-wrapper">
				<h3>
	                <a th:href="@{/ui/rolegroups/list}" class="btn btn-default">
	                    <span><i class="fa fa-arrow-left"></i> </span>
	                </a>
					<span th:text="#{html.page.rolegroup.view.title}"></span>
				</h3>

				<div class="panel panel-default">
					<div class="panel-heading"></div>
					<div class="panel-body">
						<form class="form-horizontal" th:object="${rolegroup}">
							<fieldset>
								<div class="form-group">
					                <label class="col-sm-2 control-label" th:text="#{html.entity.rolegroup.name}"></label>
					                <div class="col-sm-8">
										<input th:field="${rolegroup.name}" class="form-control" disabled="disabled" />
					                </div>
						        </div>
							</fieldset>

							<fieldset>
								<div class="form-group">
									<label class="col-sm-2 control-label" th:text="#{html.entity.rolegroup.description}"></label>
									<div class="col-sm-8">
										<div class="form-control preformat preformat-display" th:text="${rolegroup.description}"></div>
									</div>
								</div>
							</fieldset>

							<fieldset th:if="${@settingsService.isRequestApproveEnabled()}">
								<div class="form-group">

									<label class="col-sm-2 control-label"
										   th:text="#{html.entity.itsystem.requestersetting}"></label>
									<div class="col-sm-8">
										<select id="requesterSettingsSelect" class="form-control" disabled multiple
												th:field="*{requesterPermission}"
												th:attr="data-groupid=${rolegroup.id}">
											<option th:each="requesterOpt : ${T(dk.digitalidentity.rc.rolerequest.model.enums.RequestableBy).values()}"
													th:value="${requesterOpt}"
													th:text="#{__${requesterOpt.getMessage()}__}"></option>
										</select>

									</div>
								</div>
								<div class="form-group mt-3" style="margin-top:1.5rem;">
									<label class="col-sm-2 control-label"
										   th:text="#{html.entity.itsystem.approversetting}"></label>
									<div class="col-sm-8">
										<select id="approverSettingsSelect" class="form-control" disabled multiple
												th:field="*{approverPermission}"
												th:attr="data-groupid=${rolegroup.id}">
											<option th:each="approverOpt : ${T(dk.digitalidentity.rc.rolerequest.model.enums.ApprovableBy).values()}"
													th:value="${approverOpt}"
													th:text="#{__${approverOpt.getMessage()}__}"></option>
										</select>
									</div>
								</div>
							</fieldset>

							<fieldset th:if="${@permissionCheck.isAnyAllowedForEntity(section.ROLE_GROUP, permission.UPDATE, permission.DELETE, permission.CREATE)}">
								<div class="form-group">
									<label class="col-sm-2 control-label" th:text="#{html.entity.view.action.label}"></label>

									<div class="col-sm-8">
										<a th:if="${@permissionCheck.isAllowed(section.ROLE_GROUP, permission.UPDATE)}" th:href="@{/ui/rolegroups/edit/{id}(id=${rolegroup.id})}">
											<span class="btn btn-lg btn-primary" th:text="#{html.entity.view.action.edit}"></span>
										</a>
									</div>
								</div>
							</fieldset>
						</form>

						<ul class="nav nav-tabs">
						  	<li class="active">
								<a data-toggle="tab" href="#roles_menu" th:text="#{html.page.rolegroup.list.roles}"></a>
							</li>

							<li>
								<a data-toggle="tab" href="#users_menu" th:text="#{html.entity.userrole.users}"></a>
							</li>

							<li>
								<a data-toggle="tab" href="#ous_menu" th:text="#{html.entity.userrole.orgunits}"></a>
							</li>
						</ul>

						<div class="tab-content">
							<div id="roles_menu" class="tab-pane fade in active">
								<table id="listTable" class="table table-striped table-hover listTable">
									<thead>
										<tr>
											<th class="col-md-3" th:text="#{html.entity.rolegroup.name}"></th>
											<th class="col-md-3" th:text="#{html.entity.rolegroup.itsystem}"></th>
											<th class="col-md-6" th:text="#{html.entity.rolegroup.description}"></th>
										</tr>
									</thead>
									<tbody>
									    <tr th:each="assignment : ${rolegroup.userRoleAssignments}">
									    	<td th:text="${assignment.userRole.name}"></td>
									    	<td th:text="${assignment.userRole.itSystem.name}"></td>
									    	<td class="preformat" th:text="${assignment.userRole.description}"></td>
						    			</tr>
					    			</tbody>
								</table>
							</div>

							<div id="users_menu" class="tab-pane fade in">
							</div>

							<div id="ous_menu" class="tab-pane fade in">
							</div>
						</div>
					</div>
				</div>
	        </div>
	    </section>
    </div>

	<nav th:replace="~{fragments/footer :: footer}"></nav>

	<script th:replace="~{fragments/datatables :: datatables(orderColumnValue=1)}"></script>
	<script th:replace="~{fragments/assignDatePicker :: content}"></script>

	<script type="application/json" th:inline="javascript" id="rolegroup-view-config">
		{
			"url": [[@{/rest/rolegroups/}]],
			"uiUrl": [[@{/ui/rolegroups/}]],
			"userRestUrl": [[@{/rest/users/}]],
			"ouRestUrl": [[@{/rest/ous/}]],
			"roleId": [[${rolegroup.id}]],
			"fieldUpdatedMsg": [[#{html.entity.rolegroup.updatedmsg}]],
			"fieldNotUpdatedMsg": [[#{html.entity.rolegroup.failedupdatemsg}]],
			"deleteAssignmentConfirmTxt": [[#{html.control.button.yes}]],
			"deleteAssignmentCancelTxt": [[#{html.control.button.cancel}]],
			"txtQueueSpinner": [[#{html.common.queue.spinner.working}]],
			"titlesEnabled": [[${titlesEnabled}]],
			"infoMessage": [[${infoMessage}]],
			"errorMessage": [[${errorMessage}]]
		}
	</script>
	<script th:src="@{/js/service/Select2Service.js}"></script>
	<script th:src="@{/js/service/NotificationService.js}"></script>
	<script th:src="@{/js/rolegroups/view.js}"></script>
</body>
</html>
