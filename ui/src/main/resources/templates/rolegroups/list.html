<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header (title=#{html.page.rolegroups.list.title})}"></head>
<body class="layout-fixed">
<div class="wrapper">
	<header th:replace="~{fragments/navbar :: navbar-header(subpage = 'roles')}"></header>
	<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'rolegroups.list', subpage = 'roles')}"></aside>

	<section>
		<div class="content-wrapper">
			<div class="panel panel-default">
				<div class="panel-heading"></div>
				<div class="panel-body">
					<div class="table-responsive">
						<table id="listTable" class="table table-striped table-hover listTable">
							<thead>
							<tr>
								<th class="col-md-2" th:text="#{html.entity.userrole.name}"></th>
								<th class="col-md-6" th:text="#{html.entity.userrole.description}"></th>
								<th th:if="${@settingsService.isRequestApproveEnabled()}"
									th:text="#{html.entity.userrole.requestpermission}"></th>
								<th th:if="${@settingsService.isRequestApproveEnabled()}"
									th:text="#{html.entity.userrole.approvepermission}"></th>

								<th class="col-md-1" th:text="#{html.control.operations}"></th>
							</tr>
							</thead>

							<tbody>
							<tr th:each="roleGroup : ${roleGroups}">
								<td th:text="${roleGroup.name}"></td>
								<td class="preformat" th:text="${roleGroup.description}"></td>
								<td th:if="${@settingsService.isRequestApproveEnabled()}"
									th:text="${#strings.listJoin(roleGroup.requesterPermission.![displayName], ', ')}"></td>
								<td th:if="${@settingsService.isRequestApproveEnabled()}"
									th:text="${#strings.listJoin(roleGroup.approverPermission.![displayName], ', ')}"></td>
								<td>
											<a th:if="${roleGroup.allowedActions.isReadable()}"
											   th:href="@{/ui/rolegroups/view/{id}(id=${roleGroup.id})}"><em class="fa fa-search"></em></a>
											<a th:if="${roleGroup.allowedActions.isEditable}"
											   th:href="@{/ui/rolegroups/edit/{id}(id=${roleGroup.id})}"><em class="fa fa-pencil"></em></a>
											<a th:if="${roleGroup.allowedActions.isDeletable}" href="#"
											   class="openConfirmDeleteDialog" th:attr="data-id=${roleGroup.id}"><em class="fa fa-remove"></em></a>
											<a th:if="${roleGroup.allowedActions.isDuplicateable}" href="#"
											   th:href="@{/ui/rolegroups/copy/{id}(id=${roleGroup.id})}" th:attr="data-id=${roleGroup.id}"><em class="fa fa-clone"></em></a>
								</td>
							</tr>
							</tbody>
							<tfoot>
							<tr>
								<th class="input-filter"></th>
								<th class="input-filter"></th>
								<th th:if="${@settingsService.isRequestApproveEnabled()}">&nbsp;</th>
								<th th:if="${@settingsService.isRequestApproveEnabled()}">&nbsp;</th>
								<th>&nbsp;</th>
							</tr>
							</tfoot>
						</table>
					</div>
				</div>
			</div>
		</div>
	</section>
</div>

<nav th:replace="~{fragments/footer :: footer}"></nav>

<script th:replace="~{fragments/datatables :: datatables}"></script>
<script type="application/json" th:inline="javascript" id="rolegroups-list-config">
	{
		"tryDeleteUrl": [[@{/rest/rolegroups/trydelete/}]],
		"listUrl": [[@{/ui/rolegroups/list}]],
		"deleteUrl": [[@{/rest/rolegroups/delete/}]],
		"titleTxt": [[#{html.entity.rolegroup.delete.confirm.title}]],
		"bodyTxt": [[#{html.entity.rolegroup.delete.confirm.body}]],
		"bodyTxtAdditional": [[#{html.entity.rolegroup.delete.confirm.body.additional}]],
		"cancelTxt": [[#{html.control.button.cancel}]],
		"confirmTxt": [[#{html.control.button.delete}]],
		"errorMsg": [[#{html.default.message.error}]]
	}
</script>
<script th:src="@{/js/service/SweetAlertService.js}"></script>
<script th:src="@{/js/rolegroups/list.js}"></script>
</body>
</html>
