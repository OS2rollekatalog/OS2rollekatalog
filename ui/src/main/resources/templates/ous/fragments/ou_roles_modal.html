<th:block th:fragment="ouRolesModal" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<div class="modal fade bd-example-modal-lg" id="modal-ou" role="dialog">
		<div class="modal-dialog modal-xl">

			<!-- Modal content-->
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close js-close-ou-roles-modal">&times;</button>
					<h4 id="ouRolesModalHeader" th:text="#{html.page.ous.edit.title.choose}"></h4>
					<p id="ouRolesModalRoleName"></p>
				</div>

				<div class="modal-body" style="overflow-y: initial !important;">
					<p th:utext="#{html.page.ous.edit.choose.text.intro}"></p>
					<ul>
						<li th:if="${titles != null and titles.size() > 0}" th:text="#{html.page.ous.edit.choose.text.titles}"></li>
						<li th:text="#{html.page.ous.edit.choose.text.exceptedusers}"></li>
						<li th:text="#{html.page.ous.edit.choose.text.manager}"></li>
						<li th:text="#{html.page.ous.edit.choose.text.all}"></li>
						<li th:text="#{html.page.ous.edit.choose.text.remove}"></li>
					</ul>

					<ul class="nav nav-tabs" id="dataTabs" style="display: flex; flex-wrap: wrap;">
						<li th:if="${titles != null and titles.size() > 0}" class="active">
							<a data-toggle="tab" data-tab-type="ou_roles_title_menu" href="#ou_roles_title_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.titles}"></a>
						</li>

						<li th:classappend="${(titles == null or titles.size() == 0) ? 'active' : ''}">
							<a data-toggle="tab" data-tab-type="ou_roles_excepted_users_menu" href="#ou_roles_excepted_users_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.exceptedusers}"></a>
						</li>

						<li th:if="${allTitles != null and allTitles.size() > 0}">
							<a data-toggle="tab" data-tab-type="ou_roles_title_inherited_menu" href="#ou_roles_title_inherited_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.excepttitlesinherented}"></a>
						</li>

						<li th:if="${titles != null and titles.size() > 0}">
							<a data-toggle="tab" data-tab-type="ou_roles_title_disinherited_menu" href="#ou_roles_title_disinherited_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.excepttitlesdisinherented}"></a>
						</li>

						<li th:if="${allTitles != null and allTitles.size() > 0}">
							<a data-toggle="tab" data-tab-type="ou_roles_title_positive_inherited_menu" href="#ou_roles_title_positive_inherited_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.titlesInherited}"></a>
						</li>
                        <li>
                            <a data-toggle="tab" data-tab-type="ou_roles_manager_menu" href="#ou_roles_manager_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.manager}"></a>
                        </li>
                        <li th:if="${functions != null and functions.size() > 0}">
							<a data-toggle="tab" data-tab-type="ou_roles_functions_menu" href="#ou_roles_functions_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.functions}"></a>
						</li>
						<li>
							<a data-toggle="tab" data-tab-type="ou_roles_inherited_with_exceptions_menu" href="#ou_roles_inherited_with_exceptions_menu" style="white-space: pre" th:text="#{html.page.ous.edit.tab.inheritedWithExceptions}"></a>
						</li>
					</ul>

					<div class="tab-content">
						<div id="ou_roles_title_menu" class="tab-pane active" th:if="${titles != null and titles.size() > 0}">
							<table th:if="${titles != null and titles.size() > 0}" id="ou_roles_listTable1" class="table table-striped">
								<thead>
									<tr>
										<th class="col-md-2" th:text="#{html.entity.title.checked}"></th>
										<th class="col-md-10" th:text="#{html.entity.title.name}"></th>
									</tr>
								</thead>

								<tbody>
									 <tr th:each="title : ${titles}">
										<td>
											<div class="checkbox c-checkbox">
												<label>
													<input class="title-checkbox" type="checkbox" th:attr="data-id=${title.id}, checked=${title.state.checked}" />
													<span class="fa fa-check"></span>
												</label>
											</div>
										</td>

										<td>
											<span th:text="${title.name} + ' '"></span>
											<span th:if="${title.emptyTitle}" class="badge" style="background-color: #ff8517; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.empty}"></span>
											<span th:if="${title.onAssignmentButNotPosition}" class="badge" style="background-color: grey; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.inactive}"></span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>

						<div id="ou_roles_excepted_users_menu" th:classappend="${(titles == null or titles.size() == 0) ? 'active' : ''}" class="tab-pane">
						</div>

						<div id="ou_roles_title_inherited_menu" class="tab-pane"  th:if="${allTitles != null and allTitles.size() > 0}">
							<table id="ou_roles_listTable3" class="table table-striped">
								<thead>
								<tr>
									<th class="col-md-2" th:text="#{html.entity.title.checked}"></th>
									<th class="col-md-10" th:text="#{html.entity.title.name}"></th>
								</tr>
								</thead>

								<tbody>
									<tr th:each="negative : ${allTitles}">
										<td>
											<div class="checkbox c-checkbox">
												<label>
													<input class="inherited-checkbox" type="checkbox" th:attr="data-id=${negative.id}, checked=${negative.state.checked}" />
													<span class="fa fa-check"></span>
												</label>
											</div>
										</td>

										<td>
											<span th:text="${negative.name} + ' '"></span>
											<span th:if="${negative.emptyTitle}" class="badge" style="background-color: #ff8517; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.empty}"></span>
											<span th:if="${negative.onAssignmentButNotPosition}" class="badge" style="background-color: grey; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.inactive}"></span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>

						<div id="ou_roles_title_disinherited_menu" class="tab-pane"  th:if="${titles != null and titles.size() > 0}">
							<table id="ou_roles_listTable4" class="table table-striped">
								<thead>
								<tr>
									<th class="col-md-2" th:text="#{html.entity.title.checked}"></th>
									<th class="col-md-10" th:text="#{html.entity.title.name}"></th>
								</tr>
								</thead>

								<tbody>
									<tr th:each="title : ${titles}">
										<td>
											<div class="checkbox c-checkbox">
												<label>
													<input class="disinherited-checkbox" type="checkbox" th:attr="data-id=${title.id}, checked=${title.state.checked}" />
													<span class="fa fa-check"></span>
												</label>
											</div>
										</td>

										<td>
											<span th:text="${title.name} + ' '"></span>
											<span th:if="${title.emptyTitle}" class="badge" style="background-color: #ff8517; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.empty}"></span>
											<span th:if="${title.onAssignmentButNotPosition}" class="badge" style="background-color: grey; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.inactive}"></span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>

						<div id="ou_roles_title_positive_inherited_menu" class="tab-pane"  th:if="${allTitles != null and allTitles.size() > 0}">
							<table id="ou_roles_listTable5" class="table table-striped">
								<thead>
								<tr>
									<th class="col-md-2" th:text="#{html.entity.title.checked}"></th>
									<th class="col-md-10" th:text="#{html.entity.title.name}"></th>
								</tr>
								</thead>

								<tbody>
								<tr th:each="positiveTitle : ${allTitles}">
									<td>
										<div class="checkbox c-checkbox">
											<label>
												<input class="positive-titles-inherited-checkbox" type="checkbox" th:attr="data-id=${positiveTitle.id}, checked=${positiveTitle.state.checked}" />
												<span class="fa fa-check"></span>
											</label>
										</div>
									</td>

									<td>
										<span th:text="${positiveTitle.name} + ' '"></span>
										<span th:if="${positiveTitle.emptyTitle}" class="badge" style="background-color: #ff8517; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.empty}"></span>
										<span th:if="${positiveTitle.onAssignmentButNotPosition}" class="badge" style="background-color: grey; color: #FFFFFF;" th:text="#{html.page.ous.edit.tab.titles.inactive}"></span>
									</td>
								</tr>
								</tbody>
							</table>
						</div>

                        <div id="ou_roles_manager_menu" class="tab-pane">
                            <p th:text="#{html.page.ous.edit.tab.manager.explainer}"></p>
                            <table id="ou_roles_manager_table" class=" listTable table table-striped">
                                <thead>
                                    <tr>
                                        <th class="col-lg-6" th:text="#{html.entity.user.name}"></th>
                                        <th class="col-lg-3" th:text="#{html.entity.user.userId}"></th>
                                        <th class="col-lg-3" th:text="#{html.entity.user.role}"></th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:if="${manager != null}">
                                        <td th:text="${manager.name}"></td>
                                        <td th:text="${manager.userId}"></td>
                                        <td th:text="#{html.page.ous.edit.tab.manager.role.manager}"></td>
                                    </tr>
                                    <tr th:each="substitute : ${substitutes}">
                                        <td th:text="${substitute.name}"></td>
                                        <td th:text="${substitute.userId}"></td>
                                        <td th:text="#{html.page.ous.edit.tab.manager.role.substitute}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

						<div id="ou_roles_inherited_with_exceptions_menu" class="tab-pane">
							<p th:text="#{html.page.ous.edit.tab.inheritedWithExceptions.explainer}"></p>
							<div id="ou_to_exclude_tree" style="max-height: 300px; overflow-y: auto;"></div>
						</div>

                        <div th:if="${functions != null and functions.size() > 0}" id="ou_roles_functions_menu" class="tab-pane">
                            <table id="ou_roles_functions_table" class=" listTable table table-striped">
                                <thead>
                                <tr>
                                    <th class="col-md-2" th:text="#{html.entity.function.checked}"></th>
                                    <th class="col-lg-6" th:text="#{html.entity.function.name}"></th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="function : ${functions}">
                                    <td>
                                        <div class="checkbox c-checkbox">
                                            <label>
                                                <input class="function-checkbox" type="checkbox" th:attr="data-id=${function.uuid}, checked=${function.checked}" />
                                                <span class="fa fa-check"></span>
                                            </label>
                                        </div>
                                    </td>
                                    <td th:text="${function.name}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

					</div>

	               	<div style="height: 70px;">
						<h4 class="md-12" th:text="#{html.word.validity}"></h4>

						<b class="col-sm-1" style="padding-top: 7px;" th:text="#{html.word.from}"></b>
						<div class="col-md-5">
							<div class="form-group">
								<div class="input-group date" id="startDatePickerOU">
									<input type="text" class="form-control"/>
									<span class="input-group-addon">
										<span class="fa fa-calendar"></span>
									</span>
								</div>
							</div>
						</div>

						<b class="col-sm-1" style="padding-top: 7px;" th:text="#{html.word.to}"></b>
						<div class="col-md-5">
							<div class="form-group">
								<div class="input-group date" id="stopDatePickerOU">
									<input type="text" class="form-control" />
									<span class="input-group-addon">
										<span class="fa fa-calendar"></span>
									</span>
								</div>
							</div>
						</div>
					</div>
					<div style="height: 70px;" th:if="${@settingsService.isCaseNumberEnabled()}">
						<h4 class="md-12" th:text="#{html.page.users.manage.assignment.caseNumber}"></h4>

						<b class="col-sm-2 pt-2" th:text="#{html.page.users.manage.assignment.caseNumber}"></b>
						<div class="col-md-10">
							<div class="form-group">
								<input type="text"
									   class="form-control"
									   id="caseNumber"
									   placeholder="indtast sagsnummer"
									   maxlength="150"/>
							</div>
						</div>
					</div>
				</div>

				<div id="assignmentLoadingOverlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 1050; align-items: center; justify-content: center;">
					<div style="text-align: center;">
						<i class="fa fa-spinner fa-spin fa-3x" style="color: #337ab7;"></i>
						<p style="margin-top: 10px; font-size: 16px; color: #333;" th:text="#{html.page.ous.edit.button.assign.spinner}"></p>
					</div>
				</div>

				<div class="modal-footer">
					<button type="button" disabled="disabled" id="assignInheritedWithExceptionsButton" class="btn btn-primary"
							th:text="#{html.page.ous.edit.button.assign.inheritedWithExceptions}">
					</button>
					<button type="button" disabled="disabled" id="titleAssignTitlesButton" class="btn btn-primary" th:text="#{html.page.ous.edit.button.assign}"></button>
					<button type="button" disabled="disabled" id="assignWithExceptionsButton" class="btn btn-primary" th:text="#{html.page.ous.edit.button.assign.exceptedusers}"></button>
                    <button type="button" disabled="disabled" id="assignWithTitlesAndExceptionsButton" class="btn btn-primary" th:text="#{html.page.ous.edit.button.assign.titles_and_exceptedusers}"></button>
					<button type="button" disabled="disabled" id="assignPositiveWithInheritanceButton" class="btn btn-primary" th:text="#{html.page.ous.edit.button.assign.titlesInherited}"></button>
					<button type="button" disabled="disabled" id="assignNegativeWithInheritanceButton" class="btn btn-primary" th:text="#{html.page.ous.edit.tab.excepttitlesinherented}"></button>
					<button type="button" disabled="disabled" id="assignNegativeWithoutInheritanceButton" class="btn btn-primary" th:text="#{html.page.ous.edit.tab.excepttitlesdisinherented}"></button>
					<div class="btn-group" id="titleInheritButton">
                        <button id="assignAllButton" type="button" style="margin-left: 5px;" class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
                        	<span>
								<span th:text="#{html.page.ous.edit.button.assign.intro}"></span>&nbsp;
								<em class="fa fa-fw fa-caret-down"></em>
							</span>
                        </button>
						<ul class="dropdown-menu">
							<li><a href="#" id="assignEveryoneChoiceDropdownForTestCases" th:text="#{html.page.ous.edit.button.assign.all}"></a></li>
							<li><a href="#" id="assignEveryoneWithInheritanceChoice" th:text="#{html.page.ous.edit.button.assign.all.inheritance}"></a></li>
			  			</ul>
			  		</div>
                    <div class="btn-group" id="managerInheritButton">
                        <button id="assignManagerButton" type="button" style="margin-left: 5px;" class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
                        	<span>
								<span th:text="#{html.page.ous.edit.button.assign.manager.intro}"></span>&nbsp;
								<em class="fa fa-fw fa-caret-down"></em>
							</span>
                        </button>
                        <ul class="dropdown-menu">
							<li><a href="#" id="assignManagerOnlyButton" th:text="#{html.page.ous.edit.button.assign.manager.manager}"></a></li>
							<li><a href="#" id="assignManagerWithInheritanceButton" th:text="#{html.page.ous.edit.button.assign.manager.manager.inheritance}"></a></li>
							<li><a href="#" id="assignManagerAndSubstitutesButton" th:text="#{html.page.ous.edit.button.assign.manager.managerAndSubstitutes}"></a></li>
							<li><a href="#" id="assignManagerAndSubstitutesWithInheritanceButton" th:text="#{html.page.ous.edit.button.assign.manager.managerAndSubstitutes.inheritance}"></a></li>
                        </ul>
                    </div>
                    <div class="btn-group" id="functionInheritButton">
                        <button id="assignFunctionButton" type="button" style="margin-left: 5px;" class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
                        	<span>
								<span th:text="#{html.page.ous.edit.button.assign.function.intro}"></span>&nbsp;
								<em class="fa fa-fw fa-caret-down"></em>
							</span>
                        </button>
                        <ul class="dropdown-menu">
							<li><a href="#" id="assignFunctionAllButton" th:text="#{html.page.ous.edit.button.assign.all}"></a></li>
							<li><a href="#" id="assignFunctionAllWithInheritanceButton" th:text="#{html.page.ous.edit.button.assign.all.inheritance}"></a></li>
                        </ul>
                    </div>
					<button type="button" class="btn btn-warning js-close-ou-roles-modal" style="margin-left: 5px;" th:text="#{html.control.button.cancel}"></button>
				</div>
			</div>
		</div>
	</div>
</th:block>

<th:block th:fragment="ouRolesModalScript" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<script th:src="@{/js/service/JsTreeService.js}"></script>
	<script th:src="@{/js/service/NotificationService.js}"></script>
	<script th:src="@{/js/ous/service/OuRoleAssignmentService.js}"></script>
	<script th:src="@{/js/ous/service/OuRolesModalService.js}"></script>
	<script th:src="@{/js/ous/service/OuRolesEditModalService.js}"></script>

	<script id="ou-roles-modal-config" type="application/json" th:inline="javascript">
		{
			"titlesEnabled": [[${titlesEnabled}]],
			"fieldUpdatedMsg": [[#{html.entity.rolegroup.updatedmsg}]],
			"fieldNotUpdatedMsg": [[#{html.entity.rolegroup.failedupdatemsg}]],
			"restUrl": [[@{/rest/ous/}]],
			"uiUrl": [[@{/ui/ous/manage/}]],
			"headerChoose": [[#{html.page.ous.edit.title.choose}]],
			"headerChooseEdit": [[#{html.page.ous.edit.title.choose.edit}]],
			"noChildrenMsg": [[#{html.page.ous.edit.tab.inheritedWithExceptions.nochildren}]],
			"usersAlreadyAssignedDirectlyMsg": [[#{html.orgunit.role.alreadyassigned}]]
		}
	</script>

	<script th:src="@{/js/ous/fragments/ou-roles-modal.js}"></script>
</th:block>
