<th:block th:fragment="ouAssignedRoles" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<fieldset>
		<div class="btn-group">
			<button type="button" style="width: auto !important;" class="btn btn-primary btn-lg dropdown-toggle" data-toggle="dropdown">
				<em class="fa fa-fw fa-cog"></em>
			</button>

			<ul class="dropdown-menu" role="menu" id="dataTableDropdown">
				<li><a href="#" data-cid="0" class="js-toggle-column"><em class="fa fa-fw"></em><span th:text="#{html.page.ous.manage.assignment.name}"></span></a></li>
				<li><a href="#" data-cid="1" class="js-toggle-column"><em class="fa fa-fw"></em><span th:text="#{html.enum.assignmenttype}"></span></a></li>
				<li><a href="#" data-cid="2" class="js-toggle-column"><em class="fa fa-fw"></em><span th:text="#{html.page.ous.manage.assignment.assignmentType}"></span></a></li>
				<li><a href="#" data-cid="3" class="js-toggle-column"><em class="fa fa-fw"></em><span th:text="#{html.word.validity}"></span></a></li>
				<li><a href="#" data-cid="4" class="js-toggle-column"><em class="fa fa-fw"></em><span th:text="#{html.page.ous.manage.assignment.itsystem}"></span></a></li>
				<li><a href="#" data-cid="5" class="js-toggle-column"><em class="fa fa-fw"></em><span th:text="#{html.page.users.manage.assignment.description}"></span></a></li>
				<li th:if="${@settingsService.isCaseNumberEnabled()}"><a href="#" data-cid="6" class="js-toggle-column"><em class="fa fa-fw"></em><span th:text="#{html.page.users.manage.assignment.caseNumber}"></span></a></li>
			</ul>
		</div>
		<th:block th:if="${canAssign}">
			<a href="#" id="addUserRoleAssignment" class="btn btn-lg btn-primary js-load-add-user-role" style="width:auto;" th:text="#{html.page.users.manage.roles.add.userrole}"></a>
			<a href="#" id="addRoleGroupAssignment" class="btn btn-lg btn-primary js-load-add-role-group" th:text="#{html.page.users.manage.roles.add.rolegroup}"></a>
			<a href="#" id="toggleBulkRemoveRoles" class="js-toggle-bulk-remove-roles btn btn-lg btn-primary" style="width:auto;" th:text="#{html.page.roles.bulk.remove.select.btn}"></a>
			<button id="bulkRemoveRolesSubmitBtn" type="button" class="js-bulk-remove-roles-submit btn btn-lg btn-danger" style="width:auto; display:none;" disabled="disabled">
				<span th:text="#{html.page.roles.bulk.remove.submit.btn}"></span>
				<span id="bulkRemoveRolesSelectedCount"></span>
			</button>
		</th:block>

		<div class="form-group" style="margin-top:10px;">
			<div class="table-responsive">
				<table id="listTable" class="table table-striped table-hover listTable">
					<thead>
						<tr>
							<th class="col-md-2" th:text="#{html.page.ous.manage.assignment.name}"></th>
							<th class="col-md-1" th:text="#{html.enum.assignmenttype}"></th>
							<th class="col-md-2" th:text="#{html.page.ous.manage.assignment.assignmentType}"></th>
							<th class="col-md-2" th:text="#{html.word.validity}"></th>
							<th class="col-md-1" th:text="#{html.page.ous.manage.assignment.itsystem}"></th>
							<th class="col-md-2" th:text="#{html.page.users.manage.assignment.description}"></th>
							<th th:if="${@settingsService.isCaseNumberEnabled()}" class="col-md-1" th:text="#{html.page.users.manage.assignment.caseNumber}"></th>
							<th class="col-md-1" th:text="#{html.control.operations}"></th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="assignment : ${assignments}">
							<td>
								<span th:text="${assignment.name}"></span>
								<div th:text="#{__${assignment.type.message}__}" style="font-size: smaller; color: black;"></div>
							</td>

							<td>
								<span th:text="#{__${assignment.assignedThrough.message}__}"></span>
								<div th:if="${assignment.assignedThroughName != null}" th:text="${assignment.assignedThroughName}" style="font-size: smaller; color: black;"></div>
							</td>

							<th:block th:switch="${assignment.assignmentType}">
								<td th:case="-13" th:text="#{html.entity.ou.assigned.inherit.with.excepted.ous}"></td>
                                <td th:case="-12" th:text="#{html.entity.ou.assigned.all.function.inherit}"></td>
                                <td th:case="-11" th:text="#{html.entity.ou.assigned.all.function}"></td>
								<td th:case="-10" th:text="#{html.entity.ou.assigned.all.managerAndSubstitutes.inherit}"></td>
								<td th:case="-9" th:text="#{html.entity.ou.assigned.all.manager.inherit}"></td>
                                <td th:case="-8" th:text="#{html.entity.ou.assigned.all.managerAndSubstitutes}"></td>
								<td th:case="-7" th:text="#{html.entity.ou.assigned.all.manager}"></td>
								<td th:case="-6" th:text="#{html.entity.ou.assigned.all.title.and.with.exceptions}"></td>
								<td th:case="-5" th:text="#{html.entity.ou.assigned.all.title.inherit}"></td>
								<td th:case="-4" th:text="#{html.entity.ou.assigned.all.title.exceptions}"></td>
								<td th:case="-3" th:text="#{html.entity.ou.assigned.all.title.exceptions.inherit}"></td>
								<td th:case="-2" th:text="#{html.entity.ou.assigned.inherit}"></td>
								<td th:case="-1" th:text="#{html.entity.ou.assigned.all}"></td>
								<td th:case="0" th:text="#{html.entity.ou.assigned.all.with.exceptions}"></td>
								<td th:case="1" th:text="#{html.entity.ou.assigned.one}"></td>
								<td th:case="*" th:text="#{html.entity.ou.assigned.many(${assignment.assignmentType})}"></td>
							</th:block>

							<td>
								<ul th:if="${assignment.startDate != null or assignment.stopDate != null}" style="padding-left: 0px; list-style-type: none; margin-bottom: 0px;">
									<li th:if="${assignment.startDate != null}" th:text="#{html.word.assigned} + ' ' + ${assignment.startDate}"></li>
									<li th:if="${assignment.stopDate != null}" th:text="#{html.word.deassigned} + ' ' + ${assignment.stopDate}"></li>
								</ul>
								<span th:if="${assignment.startDate == null and assignment.stopDate == null}" th:text="#{html.word.indefinite}"></span>
							</td>

							<td th:text="${assignment.itSystem?.name}"></td>
							<td class="preformat" th:text="${assignment.description}"></td>
							<td th:if="${@settingsService.isCaseNumberEnabled()}" th:text="${assignment.caseNumber ?: ''}"></td>
							<td th:attr="data-assignmentid=${assignment.assignmentId}, data-assignmenttype=${assignment.assignmentType}, data-roleid=${assignment.roleId}, data-objtype=${assignment.type}, data-startdate=${assignment.startDate}, data-stopdate=${assignment.stopDate}, data-name=${assignment.name}">
								<a
									href="#"
									th:if="${canAssign && assignment.canEdit}"
									class="js-edit-role-assignment">
									<em class="fa fa-pencil"></em>
								</a>
								<a
									href="#"
									th:if="${canAssign && assignment.canEdit}"
									class="js-delete-role-assignment">
									<em class="fa fa-times"></em>
								</a>
								<label class="c-checkbox" th:if="${canAssign && assignment.canEdit}" style="display:none; vertical-align:middle; margin-bottom:0;">
									<input type="checkbox" class="js-bulk-remove-role-checkbox"/>
									<span class="fa fa-check"></span>
								</label>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</fieldset>
</th:block>
