<th:block th:fragment="requestLogDetailModal" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <div class="modal fade" id="requestLogDetailModal" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title" th:text="#{requestmodule.html.log.detailmodal.title}"></h3>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <table id="requestLogDetailModalTable" class="table table-striped request-log-detail-table">
                        <tbody id="requestLogDetailModalList"></tbody>
                    </table>
                    <p id="requestLogDetailModalFallback" class="request-log-detail-fallback"></p>
                    <template id="requestLogDetailRowTemplate">
                        <tr>
                            <td class="request-log-detail-label"></td>
                            <td class="request-log-detail-value"></td>
                        </tr>
                    </template>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{requestmodule.html.log.detailmodal.close}"></button>
                </div>
            </div>
        </div>
    </div>
</th:block>
