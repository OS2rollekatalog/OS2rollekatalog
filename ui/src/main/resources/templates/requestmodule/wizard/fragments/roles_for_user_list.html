<th:block th:fragment="roles" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<div class="tabs-container" id="tabs">
		<ul class="nav nav-tabs" role="tablist">
			<li>
				<a class="nav-link active" data-toggle="tab" th:href="'#userRoleTab' + ${userUuid}"
				   th:text="#{requestmodule.html.dashboard.tabs.userRoles}"></a>
			</li>
			<li>
				<a class="nav-link" data-toggle="tab" th:href="'#roleGroupsTab' + ${userUuid}"
				   th:text="#{requestmodule.html.dashboard.tabs.roleGroups}"></a>
			</li>
			<li>
				<a class="nav-link" data-toggle="tab" th:href="'#stamdataTab' + ${userUuid}"
				   th:text="#{requestmodule.html.dashboard.tabs.stamdata}"></a>
			</li>
		</ul>
		<div class="tab-content">
			<div role="tabpanel" th:id="'userRoleTab' + ${userUuid}" class="tab-pane active">
				<div class="panel-body">
					<div class="table-responsive">
						<table th:id="'urForUserTable' + ${userUuid}" style="width: 100%" class="table table-striped table-bordered table-hover">
							<thead>
							<tr>
								<th th:text="#{requestmodule.html.dashboard.tabs.roles.itsystem}"></th>
								<th th:text="#{requestmodule.html.dashboard.tabs.roles.role}"></th>
								<th th:text="#{requestmodule.html.dashboard.tabs.roles.status}"></th>
								<th th:text="#{requestmodule.html.dashboard.tabs.roles.description}"></th>
								<th th:text="#{requestmodule.html.dashboard.tabs.roles.reason}"></th>
							</tr>
							</thead>

							<tbody>
							<tr th:each="role : ${userRoles}">
								<td th:text="${role.itSystemName}"></td>
								<td th:text="${role.name}"></td>
								<td th:text="${role.assignedThrough}"></td>
								<td class="preformat" th:text="${role.description}"></td>
								<td th:replace="~{requestmodule/fragments/assignment_reason :: reasonCell(${role.reason})}"></td>
							</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
			<div role="tabpanel" th:id="'roleGroupsTab' + ${userUuid}" class="tab-pane">
				<div class="panel-body">
					<table th:id="'rgForUserTable' + ${userUuid}" style="width: 100%" class="table table-striped table-bordered table-hover">
						<thead>
						<tr>
							<th style="display: none"></th>
							<th></th>
							<th th:text="#{requestmodule.html.dashboard.tabs.roles.role}"></th>
							<th th:text="#{requestmodule.html.dashboard.tabs.roles.status}"></th>
							<th th:text="#{requestmodule.html.dashboard.tabs.roles.description}"></th>
							<th th:text="#{requestmodule.html.dashboard.tabs.roles.reason}"></th>
						</tr>
						</thead>

						<tbody>
						<tr th:each="role : ${roleGroups}">
							<td style="display: none" th:text="${role.id}"></td>
							<td class="dt-control"></td>
							<td th:text="${role.name}"></td>
							<td th:text="${role.assignedThrough}"></td>
							<td class="preformat" th:text="${role.description}"></td>
							<td th:replace="~{requestmodule/fragments/assignment_reason :: reasonCell(${role.reason})}"></td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div role="tabpanel" th:id="'stamdataTab' + ${userUuid}" class="tab-pane">
				<div class="panel-body">
					<form class="form-horizontal" th:object="${user}">
						<div class="form-group">
							<label class="col-sm-3 control-label" th:text="#{html.entity.extuuid}"></label>
							<div class="col-sm-9">
								<input th:field="*{extUuid}" class="form-control" disabled="disabled" />
							</div>
						</div>
						<div class="form-group" th:if="*{nemloginUuid != null}">
							<label class="col-sm-3 control-label" th:text="#{html.entity.user.nemlogin_uuid}"></label>
							<div class="col-sm-9">
								<input th:field="*{nemloginUuid}" class="form-control" disabled="disabled" />
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-3 control-label" th:text="#{html.entity.user.email}"></label>
							<div class="col-sm-9">
								<input th:field="*{email}" class="form-control" disabled="disabled" />
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</th:block>
