<th:block th:fragment="kleEdit" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<fieldset>
		<div class="form-group">
			<h4 th:text="#{html.page.ous.edit.search}"></h4>
			<input class="form-control" th:id="Kle + ${type} + Search" style="margin-bottom: 5px;" />
			<button class="btn btn-lg btn-primary js-kle-save" style="margin-bottom: 20px;" th:text="#{html.page.ous.edit.save}" th:attr="data-type=${type}"></button>
			<button class="btn btn-lg btn-primary js-kle-cancel" style="margin-bottom: 20px;" th:text="#{html.page.ous.edit.cancel}" th:attr="data-type=${type}"></button>
			<div th:id="Kle+ ${type}"></div>
		</div>
		<script type="application/json" th:inline="javascript" th:id="|kle-edit-${type}-config|" class="js-kle-edit-config">
			{
				"type": [[${type}]],
				"selectedKles": [[${selectedKles}]]
			}
		</script>
		<script th:src="@{/js/fragments/kleEdit.js}"></script>
	</fieldset>
</th:block>
