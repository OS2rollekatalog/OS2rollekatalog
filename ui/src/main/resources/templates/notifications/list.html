<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header}"></head>
<body class="layout-fixed">
	<div class="wrapper">
		<header th:replace="~{fragments/navbar :: navbar-header(subpage = 'reports')}"></header>
		<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'notifications', subpage = 'reports')}"></aside>

		<section>
			<div class="content-wrapper">
				<h3 th:text="#{html.navbar.notifications}"></h3>
				<div class="panel panel-default">
					<div class="panel-heading">
						<div class="form-group form-check inline" style="margin-left:60px; position: relative; top: 15px;">
							<div class="c-radio">
								<label>
									<input type="radio" name="showInactive" value="false" checked="checked" />
									<span class="fa fa-circle"></span>
								</label>
								<label th:text="#{html.page.admin.task.filter.show.active}"></label>
							</div>
							<div class="c-radio">
								<label>
									<input type="radio" name="showInactive" value="true" />
									<span class="fa fa-circle"></span>
								</label>
								<label th:text="#{html.page.admin.task.filter.show.inactive}"></label>
							</div>
						</div>
					</div>

					<div class="panel-body">
						<div class="table-responsive">
							<table id="listTable" class="table table-striped table-hover listTable">
								<thead>
									<tr>
										<th style="display: none;" th:text="#{html.entity.notification.active}"></th>
										<th class="col-md-2" th:text="#{html.entity.notification.created}"></th>
										<th class="col-md-3" th:text="#{html.entity.notification.notificationType}"></th>
										<th class="col-md-3" th:text="#{html.entity.notification.affectedEntity}"></th>
										<th class="col-md-3" th:text="#{html.entity.notification.admin}"></th>
										<th class="col-md-1" th:text="#{html.control.operations}"></th>
									</tr>
								</thead>
								<tfoot style="display: table-row-group;">
									<tr>
										<td style="display: none;"></td>
										<td></td>
										<td></td>
										<td></td>
										<td></td>
										<td></td>
									</tr>
								</tfoot>
								<tbody>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</section>
	</div>

	<nav th:replace="~{fragments/footer :: footer}"></nav>

	<script id="notifications-list-config" type="application/json" th:inline="javascript">
		{
			"searchTxt": [[#{html.datatables.search}]],
			"dropdownTxt": [[#{html.datatables.dropdown}]],
			"infoDefaultTxt": [[#{html.datatables.info.default}]],
			"infoEmptyTxt": [[#{html.datatables.info.empty}]],
			"infoFilteredTxt": [[#{html.datatables.info.filtered}]],
			"prevTxt": [[#{html.datatables.prev}]],
			"nextTxt": [[#{html.datatables.next}]],
			"activateTitle": [[#{html.entity.notification.activate.title}]],
			"activateText": [[#{html.entity.notification.activate.text}]],
			"discardTitle": [[#{html.entity.notification.discard.title}]],
			"discardText": [[#{html.entity.notification.discard.text}]],
			"assignTitle": [[#{html.entity.notification.assign.title}]],
			"assignText": [[#{html.entity.notification.assign.text}]],
			"deassignTitle": [[#{html.entity.notification.deassign.title}]],
			"deassignText": [[#{html.entity.notification.deassign.text}]],
			"reassignTitle": [[#{html.entity.notification.reassign.title}]],
			"reassignText": [[#{html.entity.notification.reassign.text}]],
			"reassignYesBtn": [[#{html.entity.notification.reassign.yes}]],
			"reassignNoBtn": [[#{html.entity.notification.reassign.no}]],
			"changeStatusButtonConfirm": [[#{html.control.button.yes}]],
			"changeStatusButtonCancel": [[#{html.control.button.no}]],
			"typesMap": [[${typesMap}]],
			"url": [[@{/ui/}]],
			"ajaxUrl": [[@{/rest/notifications/list}]],
			"changeStatusUrl": [[@{/rest/notifications/changeStatus}]],
			"flipAssignUrl": [[@{/rest/notifications/flipAssign/}]],
			"changeStatusErrorMsg": [[#{html.setting.update.msg.failed}]],
			"userUuid": [[${userUuid}]]
		}
	</script>

	<script th:src="@{/js/DatatableService.js}"></script>
	<script th:src="@{/js/service/SweetAlertService.js}"></script>
	<script th:src="@{/js/notifications/list.js}"></script>
</body>
</html>
