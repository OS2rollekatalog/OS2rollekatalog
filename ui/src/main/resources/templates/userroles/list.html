<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header (title=#{html.page.userroles.list.title})}"></head>
<body class="layout-fixed">
<div class="wrapper">
	<header th:replace="~{fragments/navbar :: navbar-header (subpage = 'roles')}"></header>
	<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'userroles.list', subpage = 'roles')}"></aside>

	<section>
		<div class="content-wrapper">
			<div class="panel panel-default">
				<div class="panel-heading"></div>
				<div class="panel-body">
					<div class="table-responsive">
						<table id="listTable" class="table table-striped table-hover">
							<thead>
							<tr>
								<th th:text="#{html.entity.userrole.name}"></th>
								<th th:text="#{html.page.itsystem.view.title}"></th>
								<th th:text="#{html.entity.userrole.description}"></th>
								<th th:text="#{html.entity.userrole.requestpermission}"></th>
								<th th:text="#{html.entity.userrole.approvepermission}"></th>
								<th th:text="#{html.control.operations}"></th>
							</tr>
							</thead>
							<tbody>

							</tbody>
							<tfoot>
							<tr>
								<th class="input-filter"></th>
								<th class="input-filter"></th>
								<th class="input-filter"></th>
								<th ></th>
								<th ></th>
								<th>&nbsp;</th>
							</tr>
							</tfoot>
						</table>
					</div>
				</div>
			</div>
		</div>
	</section>
</div>

<link rel="stylesheet" th:href="@{/css/userroles/list.css}" />

<nav th:replace="~{fragments/footer :: footer}"></nav>

<script th:replace="~{fragments/datatables :: datatables}"></script>
<script type="module" th:src="@{/js/datatable/extension.js}"></script>
<script type="application/json" th:inline="javascript" id="userroles-list-config">
	{
		"baseUrl": [[@{/}]],
		"searchTxt": [[#{html.datatables.search}]],
		"dropdownTxt": [[#{html.datatables.dropdown}]],
		"infoDefaultTxt": [[#{html.datatables.info.default}]],
		"infoEmptyTxt": [[#{html.datatables.info.empty}]],
		"infoLoadingTxt": [[#{html.datatables.info.loading}]],
		"infoFilteredTxt": [[#{html.datatables.info.filtered}]],
		"ajaxUrl": [[@{/rest/userroles/list}]],
		"titleSyncing": [[#{html.entity.userrole.syncing}]],
		"titleFailed": [[#{html.entity.userrole.sync.failed}]],
		"titleNlFailed": [[#{html.entity.userrole.nlsync.failed}]],
		"requestApproveEnabled": [[${@settingsService.isRequestApproveEnabled()}]],
		"requestableBy": {
			"INHERIT": [[#{html.enum.sttings.requestableby.inherit}]],
			"NONE": [[#{html.enum.sttings.requestableby.none}]],
			"MANAGERORSUBSTITUTE": [[#{html.enum.sttings.requestableby.manager}]],
			"AUTHRESPONSIBLE": [[#{html.enum.sttings.requestableby.authresponsible}]],
			"AUTHORIZED": [[#{html.enum.sttings.requestableby.authorized}]],
			"EMPLOYEE": [[#{html.enum.sttings.requestableby.employee}]],
			"ADMIN": [[#{html.enum.sttings.requestableby.admin}]]
		},
		"approvableBy": {
			"INHERIT": [[#{html.enum.sttings.approvableby.inherit}]],
			"AUTOMATIC": [[#{html.enum.sttings.approvableby.automatic}]],
			"AUTHRESPONSIBLE": [[#{html.enum.sttings.approvableby.authresponsible}]],
			"MANAGERORSUBSTITUTE": [[#{html.enum.sttings.approvableby.manager}]],
			"AUTHORIZED": [[#{html.enum.sttings.approvableby.authorized}]],
			"ADMINISTRATOR": [[#{html.enum.sttings.approvableby.admin}]],
			"SYSTEMRESPONSIBLE": [[#{html.enum.sttings.approvableby.systemresponsible}]]
		},
		"tryDeleteUrl": [[@{/rest/userroles/trydelete/}]],
		"deleteUrl": [[@{/rest/userroles/delete/}]],
		"listUrl": [[@{/ui/userroles/list}]],
		"titleTxt": [[#{html.entity.userrole.delete.confirm.title}]],
		"bodyTxt": [[#{html.entity.userrole.delete.confirm.body}]],
		"bodyTxtAdditional": [[#{html.entity.userrole.delete.confirm.body.additional}]],
		"cancelTxt": [[#{html.control.button.cancel}]],
		"confirmTxt": [[#{html.control.button.delete}]],
		"errorMsg": [[#{html.default.message.error}]]
	}
</script>
<script th:src="@{/js/service/SweetAlertService.js}"></script>
<script th:src="@{/js/userroles/list.js}"></script>
</body>
</html>
