<th:block th:fragment="users" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<th:block th:if="${assignmentAddingAllowed == true}">
		<a href="#" id="addUserRoleAssignment" class="btn btn-lg btn-primary js-add-user-role" style="width:auto;" th:text="#{html.page.role.add.user}"></a>
	</th:block>
	<th:block th:if="${assignmentAddingAllowed == true}">
		<a href="#" id="addMultipleUserRoleAssignment" class="btn btn-lg btn-primary js-add-user-role-multiple" style="width:auto;" th:text="#{html.page.role.add.user.multiple}"></a>
	</th:block>

	<table id="listTableUsers" class="table table-striped table-hover listTable" th:data-holders-url="@{/rest/userroles/{id}/holders(id=${roleId})}">
		<thead>
		<tr>
			<th class="col-md-3" th:text="#{html.entity.user.name}"></th>
			<th class="col-md-1" th:text="#{html.entity.user.userId}"></th>
			<th class="col-md-1" th:text="#{html.enum.assignmenttype}"></th>
			<th class="col-md-1" th:text="#{html.word.validity}"></th>
			<th class="col-md-5" th:text="#{html.entity.user.positions}"></th>
			<th class="col-md-1" th:text="#{html.control.operations}"></th>
		</tr>
		</thead>
		<tbody></tbody>
	</table>

	<template id="holderNameCell">
		<span class="js-name"></span>
		<span class="badge badge-warning js-disabled"></span>
		<div class="small text-danger js-outweighed"></div>
	</template>
</th:block>
