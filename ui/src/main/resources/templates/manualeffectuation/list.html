<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
<head th:replace="~{fragments/header :: header (title=#{html.page.manualeffectuation.list.title})}"></head>
<body class="layout-fixed">
	<div class="wrapper">
		<header th:replace="~{fragments/navbar :: navbar-header(subpage = 'roles')}"></header>
		<aside th:replace="~{fragments/navbar :: navbar-aside (page = 'manualeffectuation', subpage = 'roles')}"></aside>

		<section>
			<div class="content-wrapper">
				<div id="filteredNotice" class="alert alert-info" style="display:none;">
					<span th:text="#{html.page.manualeffectuation.list.filtered.notice}"></span>
					<a href="#" id="showAllLink" th:text="#{html.page.manualeffectuation.list.filtered.showall}"></a>
				</div>
				<div class="panel panel-default">
					<div class="panel-heading"></div>
					<div class="panel-body">
						<div class="table-responsive">
							<table id="listTable" class="table table-striped table-hover" style="width: 100%;">
								<thead>
									<tr>
										<th th:text="#{html.page.manualeffectuation.list.user}"></th>
										<th th:text="#{html.page.manualeffectuation.list.itsystem}"></th>
										<th th:text="#{html.page.manualeffectuation.list.role}"></th>
										<th th:text="#{html.page.manualeffectuation.list.operation}"></th>
										<th th:text="#{html.control.operations}"></th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</section>
	</div>

	<div class="modal fade" id="manualEffectuationCommentModal" role="dialog" aria-hidden="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h3 class="modal-title" id="manualEffectuationCommentModalTitle"></h3>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<textarea class="form-control" id="manualEffectuationCommentInput" rows="4"></textarea>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-primary" id="manualEffectuationCommentConfirmBtn" th:text="#{html.page.manualeffectuation.list.comment.modal.confirm}"></button>
					<button type="button" class="btn btn-warning" data-dismiss="modal" th:text="#{html.control.button.cancel}"></button>
				</div>
			</div>
		</div>
	</div>

	<nav th:replace="~{fragments/footer :: footer}"></nav>

	<script type="application/json" th:inline="javascript" id="manualeffectuation-config">
		{
			"listUrl": [[@{/rest/manualeffectuation}]],
			"tildelTxt": [[#{html.page.manualeffectuation.list.operation.tildel}]],
			"fjernTxt": [[#{html.page.manualeffectuation.list.operation.fjern}]],
			"completeSuccessTxt": [[#{html.page.manualeffectuation.list.complete.success}]],
			"commentModalTitleAssignTxt": [[#{html.page.manualeffectuation.list.comment.modal.title.assign}]],
			"commentModalTitleRemoveTxt": [[#{html.page.manualeffectuation.list.comment.modal.title.remove}]]
		}
	</script>
	<script th:replace="~{fragments/datatables :: datatables}"></script>
	<script th:src="@{/js/manualeffectuation/list.js}"></script>
</body>
</html>
